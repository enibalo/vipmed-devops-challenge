name: CI/CD Pipeline 
on: [push]
jobs: 
  lint-and-test: 
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3 

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Lint and Test API Gateway Service
        run: |  
          docker compose build api-gateway
          docker run api-gateway npm run lint
          docker run api-gateway npm run test
          
      - name: Lint and Test User Service 
        run: | 
          docker compose build user-service
          docker run  user-service npm run lint
          docker run -e TEST=true user-service npm run test  

  prod-deploy: 
  # Deploying a prod image only runs for the main branch and for push tag events when it matches the pattern: v*
    if: ${{ github.ref_name == 'main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) }}
    runs-on: ubuntu-24.04
    steps: 
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create Image Tags 
        id: meta
        uses: docker/metadata-action@v6
          
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and Push API-Gateway 
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api-gateway
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}

      - name: Build and Push User-Service
        uses: docker/build-push-action@v7
        with:
          context: ./apps/user-service
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
  # Deploying a dev image only runs when the prod-deploy condition is not met 
  dev-deploy: 
    if: ${{ !( github.ref_name == 'main' || (github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ) }}
    runs-on: ubuntu-24.04
    steps: 
      - name: Checkout
        uses: actions/checkout@v6
          
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Set up Docker Buildx          
        uses: docker/setup-buildx-action@v4

      - name: Create Image Tags 
        id: meta-api
        uses: docker/metadata-action@v6
        with: 
          images: enibalo/api-gateway

      - name: Build and Push Api-Gateway 
        uses: docker/build-push-action@v7
        with:
          context: ./apps/api-gateway
          target: development
          push: true
          tags: ${{  steps.meta-api.outputs.tags }}


      - name: Create Image Tags 
        id: meta-user
        uses: docker/metadata-action@v6
        with: 
          images: enibalo/user-service

      - name: Build and Push User-Service
        uses: docker/build-push-action@v7
        with:
          context: ./apps/user-service
          target: development
          push: true
          tags: ${{ steps.meta-user.outputs.tags }}



