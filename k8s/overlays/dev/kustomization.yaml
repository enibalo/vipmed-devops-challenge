apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev overlay - deploys all resources into the "dev" namespace with
# development-specific images, resource limits, and entrypoint commands.

# Deploy all resources into the dev namespace to isolate
# development workloads from production.
namespace: dev

# Override the production image tags with development builds.
images:
- name: enibalo/user-service:prod
  newName: enibalo/user-service
  newTag: dev
- name: enibalo/api-gateway:prod
  newName: enibalo/api-gateway
  newTag: dev

# Include the base kustomization plus the dev namespace definition.
resources:
- ../../base
- namespace.yaml


# Merge dev-specific environment variables into the base ConfigMaps.
# behavior: merge means dev values override base values for the same keys
configMapGenerator:
- name: api-gateway-env
  behavior: merge
  envs:
  - api-gateway.env
- name: user-service-env
  behavior: merge
  envs:
  - user-service.env


patches:
# Reduce resource requests/limits for each service to fit within dev cluster capacity.
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "100m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "124Mi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "200m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "256Mi"
  target: 
    kind: Deployment 
    name: api-gateway-app|user-service-app
- patch: |- 
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/cpu
      value: "100m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/requests/memory
      value: "128Mi"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/cpu
      value: "250m"
    - op: replace
      path: /spec/template/spec/containers/0/resources/limits/memory
      value: "256Mi"
  target: 
    kind: StatefulSet 
    name: redis-data


replacements: 
# Scale down to a single replica per service in dev to conserve resources.
- sourceValue: "1"
  targets:
  - select:
      kind: Deployment
      name: user-service-app|api-gateway-app
    fieldPaths:
      - spec.replicas