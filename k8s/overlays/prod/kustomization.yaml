apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prod overlay - deploys all resources into the "prod" namespace.
# Uses the base configuration as-is with production image tags and
# resource limits (no overrides needed).

# Deploy all resources into the prod namespace to isolate
# production workloads from development.
namespace: prod

# Include the base kustomization plus the prod namespace definition.
resources:
- ../../base
- namespace.yaml