apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Base Kustomization for the VIPMed platform.
# Defines the core resources (user-service, api-gateway, redis) and shared
# configuration (annotations, configmaps, secrets, and port replacements).

# Apply the same ownership and repository annotations (using a8r format) to all resources in the cluster.
commonAnnotations:
  a8r.io/owner: "@enibalo"
  a8r.io/repository: "https://github.com/enibalo/vipmed-devops-challenge"

# Core application manifests that make up the base deployment.
resources:
- user-service.yaml 
- api-gateway.yaml 
- redis.yaml

generatorOptions:
  # Propagate the same ownership annotations to all resources generated by
  # configMapGenerator and secretGenerator 
  annotations:
    a8r.io/owner: "@enibalo"
    a8r.io/repository: "https://github.com/enibalo/vipmed-devops-challenge"

# Generate ConfigMaps from .env files so environment variables are injected
# into the api-gateway and user-service containers at runtime.
configMapGenerator:
- name: api-gateway-env
  envs:
  - ./env/api-gateway.env
- name: user-service-env
  envs:
  - ./env/user-service.env

# Generate Secrets from env/files. Secrets are base64-encoded by Kubernetes
# and should never be committed to version control.
secretGenerator:
- name: user-service-secrets
  envs:
  - ./env/secrets.env
  type: Opaque
- name: redis-aclfile
  files:
  - ./env/users.acl
  type: Opaque
  
# Replacements dynamically update port values across Deployments and Services
# based on the PORT environment variable defined in each ConfigMap.
# This keeps port configuration in a single source of truth (the .env files).
replacements: 
- source:
    kind: ConfigMap
    name: api-gateway-env
    fieldPath: data.PORT
  targets:
  - select:
      kind: Deployment 
      name: api-gateway-app
    fieldPaths:
      - spec.template.spec.containers.0.ports.0.containerPort
      - spec.template.spec.containers.0.livenessProbe.httpGet.port
      - spec.template.spec.containers.0.readinessProbe.httpGet.port
    options:
        create: true
  - select:
      kind: Service
      name: api-gateway
    fieldPaths:
    - spec.ports.0.port
    - spec.ports.0.targetPort
    options:
      create: true
- source:
    kind: ConfigMap
    name: user-service-env
    fieldPath: data.PORT
  targets:
  - select:
      kind: Deployment
      name: user-service-app
    fieldPaths:
      - spec.template.spec.containers.0.ports.0.containerPort
      - spec.template.spec.containers.0.livenessProbe.httpGet.port
      - spec.template.spec.containers.0.readinessProbe.httpGet.port
    options:
        create: true
  - select:
      kind: Service
      name: user-service
    fieldPaths:
    - spec.ports.0.port
    - spec.ports.0.targetPort
    options:
      create: true