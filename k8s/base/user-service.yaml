# User Service Deployment - handles user-related business logic.
# Internal service that is only accessible via the api-gateway.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service-app
  labels:
    app: user-service-app
spec:
  replicas: 3
  # Rolling update strategy: add 1 new pod before removing any old ones
  # (maxSurge: 1, maxUnavailable: 0) to ensure zero downtime during deploys.
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: user-service-app
  template:
    metadata:
      labels:
        app: user-service-app
    spec:
      containers:
      - name: user-service-app
        image:  "enibalo/user-service:prod"
        # Inject environment variables from the user-service-env ConfigMap
        envFrom:
        - configMapRef:
            name: user-service-env
        # Inject sensitive credentials (e.g., Redis password) from the user-service-secrets Secret 
        - secretRef: 
           name: user-service-secrets
        ports:
        - containerPort: 3001 
        resources:
          requests:
            cpu: 100m
            memory: 124Mi
          limits:
            cpu: 200m
            memory: 200Mi
        # Liveness probe: if /health/live fails 3 times, Kubernetes restarts
        # the container. Checks start after 15s and run every 10s.
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3001
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          timeoutSeconds: 5
        # Readiness probe: if /health/ready fails 2 times, the pod is removed
        # from Service endpoints until it recovers. Checks every 5s.
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3001
          periodSeconds: 5
          failureThreshold: 2
          successThreshold: 1
          timeoutSeconds: 3
          
---
# User Service Service - ClusterIP for internal access only.
# Other pods can reach this service through the hostname: user-service
apiVersion: v1
kind: Service
metadata:
  name: user-service
spec:
  selector:
    app: user-service-app
  ports:
    - port: 3001
      targetPort: 3001
  type: ClusterIP