# API Gateway Deployment - the entry point for all external traffic.
# Routes requests to internal services (e.g., user-service).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-app
  labels:
    app: api-gateway-app
spec:
  replicas: 3
  # Rolling update strategy: add 1 new pod before removing any old ones
  # (maxSurge: 1, maxUnavailable: 0) to ensure zero downtime during deploys.
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: api-gateway-app
  template:
    metadata:
      labels:
        app: api-gateway-app
    spec:
      containers:
      - name: api-gateway-app
        image:  "enibalo/api-gateway:prod"
        # Inject environment variables from the api-gateway-env ConfigMap
        # (generated by configMapGenerator in kustomization.yaml).
        envFrom:
        - configMapRef:
            name: api-gateway-env
        ports:
        - containerPort: 3000 
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        # Liveness probe: if /health/live fails 3 times, Kubernetes restarts
        # the container. Checks start after 15s and run every 10s.
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
          successThreshold: 1
          timeoutSeconds: 5
        # Readiness probe: if /health/ready fails 2 times, the pod is removed
        # from Service endpoints until it recovers. Checks every 5s.
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          periodSeconds: 5
          failureThreshold: 2
          successThreshold: 1
          timeoutSeconds: 3
---
# API Gateway Service - LoadBalancer type for external access.
# Exposes the API gateway to the internet/public via a cloud load balancer.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
spec:
  selector:
    app: api-gateway-app
  ports:
    - port: 3000
      targetPort: 3000
  type: LoadBalancer