apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app: redis
spec:
  ports:
  - port: 6379
  clusterIP: None
  selector:
    app: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-data 
spec:
  selector:
    matchLabels:
      app: redis 
  serviceName: "redis"
  replicas: 3 # by default is 1
  minReadySeconds: 10 # by default is 0
  template:
    metadata:
      labels:
        app: redis 
    spec:
      terminationGracePeriodSeconds: 10
      containers:
      - name: redis
        image: "redis:7-alpine"
        ports:
        - containerPort: 6379  
        resources:
          requests:
            cpu: "1"
            memory: 1Gi
          limits:
            cpu: "1"
            memory: 2Gi
        volumeMounts:
        - name: data
          mountPath: /data
        - name: aclfile
          mountPath: /usr/local/etc/redis/users.acl
  volumeClaimTemplates:
  - metadata:
      name: data

    spec:
      accessModes: [ "ReadWriteOncePod" ]
      storageClassName: "my-storage-class"
      resources:
        requests:
          storage: 1Gi