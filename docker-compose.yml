services:
  api-gateway:
    container_name: api-gateway
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes: 
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./src:/app/src:ro
    env_file:
      - ./k8s/base/env/api-gateway.env
    depends_on:
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  user-service:
    container_name: user-service
    build:
      context: ./apps/user-service
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    volumes: 
      - ./package.json:/app/package.json:ro
      - ./package-lock.json:/app/package-lock.json:ro
      - ./src:/app/src:ro
    env_file: 
      - ./k8s/base/env/user-service.env
      - ./k8s/base/env/secrets.env
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
      - ./apps/redis/redis.acl:/usr/local/etc/redis/users.acl:ro
    command:
      - redis-server
      - --aclfile
      - /usr/local/etc/redis/users.acl

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis-data:
